<header class="site-header">
  <div class="site-title">
    <a href="/">
      {{ .Site.Title }}<span class="terminal-cursor">▮</span>
    </a>
  </div>
  <nav class="site-nav">
    <ul>
      {{ $currentPage := . }}
      {{ range .Site.Menus.main }}
      <li class="{{ if or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) }}active{{ end }}">
        <a href="{{ .URL }}">{{ .Name }}</a>
      </li>
      {{ end }}
    </ul>
  </nav>
</header>
